# nginx.conf - Production Reverse Proxy & SSL Configuration
# Place this in /etc/nginx/sites-available/kesari-courier and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name kesaricourier.com *.kesaricourier.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kesaricourier.com *.kesaricourier.com;

    # SSL Certificates (Managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/kesaricourier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kesaricourier.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static Frontend SPA Build
    root /var/www/kesaricourier/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Frontend Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy to PM2 Cluster (Node.js Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads / Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Max upload limit for KYC / POD photos
    client_max_body_size 20M;
}
