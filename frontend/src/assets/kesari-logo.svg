<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="kesariOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <linearGradient id="kesariBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f2952" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Icon: Fast Dynamic K-Wing & Courier Box -->
  <g transform="translate(10, 10)">
    <!-- Base Hexagon / Shield in Royal Blue -->
    <path d="M 30 2 L 56 16 L 56 46 L 30 60 L 4 46 L 4 16 Z" fill="url(#kesariBlue)" />
    
    <!-- Forward Fast Wing / Dynamic Accent in Kesari Orange -->
    <path d="M 28 8 L 52 20 L 52 38 L 28 26 Z" fill="url(#kesariOrange)" />
    <path d="M 28 29 L 52 41 L 38 52 L 20 42 Z" fill="#ff9100" />
    
    <!-- Stylized "K" Arrow Shape in Crisp White -->
    <path d="M 17 18 L 24 18 L 24 44 L 17 44 Z" fill="#ffffff" />
    <path d="M 24 30 L 36 18 L 44 18 L 30 32 L 45 44 L 37 44 L 24 33 Z" fill="#ffffff" />

    <!-- Speed Dots -->
    <circle cx="58" cy="18" r="3" fill="url(#kesariOrange)" />
    <circle cx="62" cy="27" r="2.2" fill="#ff7a00" />
  </g>

  <!-- Wordmark -->
  <!-- KESARI in Bold Navy Blue -->
  <text x="82" y="42" font-family="'Archivo Black', 'Inter', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#0f2952" letter-spacing="1">KESARI</text>
  
  <!-- COURIER in Vibrant Orange with subtitle -->
  <text x="82" y="59" font-family="'Quicksand', 'Inter', sans-serif" font-size="12" font-weight="700" fill="#ff6200" letter-spacing="3.5">COURIER</text>
  
  <!-- Express & Logistics Accent Tag -->
  <rect x="180" y="48" width="85" height="13" rx="3" fill="#eef2ff" />
  <text x="186" y="58" font-family="'Quicksand', 'Inter', sans-serif" font-size="8" font-weight="800" fill="#1e40af" letter-spacing="1">LOGISTICS</text>
</svg>
